<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Log in to BotShield Store.">
  <title>Login – BotShield Store</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <!-- ========== NAVBAR ========== -->
  <nav class="navbar">
    <div class="container">
      <a href="/" class="navbar__brand">BotShield</a>
      <button class="navbar__toggle" aria-label="Toggle navigation">&#9776;</button>
      <ul class="navbar__links">
        <li><a href="/">Home</a></li>
        <li><a href="/products">Products</a></li>
        <li><a href="/about">Technology</a></li>
        <li><a href="/about">About</a></li>
      </ul>
      <div class="navbar__right">
        <div class="navbar__search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" placeholder="Search products..." id="search-input">
        </div>
        <button class="navbar__icon-btn" id="cart-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          Cart (0)
        </button>
        <button class="navbar__icon-btn" id="account-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </button>
      </div>
    </div>
  </nav>

  <!-- ========== LOGIN ========== -->
  <div class="login">
    <div class="login__visual">
      <img src="/static/images/mechanical_keyboard.jpg" alt="Workspace">
      <div class="login__visual-overlay">
        <div class="login__visual-brand">BotShield</div>
        <div class="login__visual-text">
          A smarter internet starts<br>with safer experiences.
        </div>
      </div>
    </div>

    <div class="login__form-side">
      <div class="login__form-container">
        <h1 class="login__title">Welcome Back</h1>
        <p class="login__subtitle">Sign in to continue to your account.</p>

        <form id="login-form" method="post" action="/login">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="name@example.com" autocomplete="email" required>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" autocomplete="current-password" required>
          </div>
          <button type="submit" class="btn btn--accent login__btn" id="login-btn">Sign In</button>
        </form>

        <div class="login__divider">
          <span class="login__divider-line"></span>
          <span class="login__divider-text">OR</span>
          <span class="login__divider-line"></span>
        </div>

        <a href="/" class="btn btn--outline login__guest-btn">Continue as Guest</a>

        <div class="login__footer">
          Don't have an account? <a href="#">Create one</a>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/js/tracker.js"></script>
  <script src="/static/js/main.js"></script>
</body>
</html>
